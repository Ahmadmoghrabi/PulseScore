name: PulseScore
options:
  bundleIdPrefix: com.ahmadmoghrabi
  deploymentTarget:
    iOS: "17.0"

targets:
  PulseScore:
    type: application
    platform: iOS
    sources:
      - path: PulseScore
    entitlements:
      path: PulseScore/PulseScore.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadmoghrabi.PulseScore
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "PulseScore reads your activity and heart rate data from Apple Health to calculate your daily Workout Score."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        # Only Debug builds ever request HealthKit write access (the #if DEBUG-gated
        # seedSampleDataForTesting() in HealthKitManager) — so only Debug declares the
        # purpose string HealthKit requires for that. Release's Info.plist has no
        # write-related string at all, matching the read-only design at every layer.
        Debug:
          INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Debug builds can seed sample activity data into the Simulator's Health store for testing. This is never used in the released app."

  PulseScoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulseScoreTests
    dependencies:
      - target: PulseScore
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PulseScore:
    build:
      targets:
        PulseScore: all
        PulseScoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PulseScoreTests
    archive:
      config: Release
