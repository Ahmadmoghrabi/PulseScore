name: Rebase
options:
  bundleIdPrefix: com.ahmadmoghrabi
  deploymentTarget:
    iOS: "17.0"

targets:
  Rebase:
    type: application
    platform: iOS
    sources:
      - path: Rebase
    entitlements:
      path: Rebase/Rebase.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ahmadmoghrabi.Rebase
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Rebase reads your activity and heart rate data from Apple Health to calculate your daily Workout Score."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        # Only Debug builds ever request HealthKit write access (the #if DEBUG-gated
        # seedSampleDataForTesting() in HealthKitManager) — so only Debug declares the
        # purpose string HealthKit requires for that. Release's Info.plist has no
        # write-related string at all, matching the read-only design at every layer.
        Debug:
          INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Debug builds can seed sample activity data into the Simulator's Health store for testing. This is never used in the released app."

  RebaseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RebaseTests
    dependencies:
      - target: Rebase
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Rebase:
    build:
      targets:
        Rebase: all
        RebaseTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RebaseTests
    archive:
      config: Release
